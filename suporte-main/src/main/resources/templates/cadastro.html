<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cadastro', 'Cadastre-se como técnico no Sistema de Suporte SENAI')}"></head>
<body class="auth-page">

  <!-- BANNER -->
  <div class="auth-banner">
    <div class="auth-banner-content animate-fade-up">
      <div class="auth-logo">🧑‍🔧</div>
      <h1 class="auth-banner-title">SENAI Suporte</h1>
      <p class="auth-banner-sub">Cadastro de Técnico</p>
    </div>
  </div>

  <!-- BODY -->
  <div class="auth-body">
    <div class="auth-card" style="max-width:520px;">

      <div class="auth-card-header">
        <h2 class="auth-card-title">Criar nova conta 🆕</h2>
        <p class="auth-card-subtitle text-muted">
          Preencha os dados abaixo para se cadastrar como técnico
        </p>
      </div>

      <div class="auth-card-body">

        <!-- Erros globais -->
        <div th:if="${erro}" class="alert alert-error" role="alert">
          <span class="alert-icon">⚠️</span>
          <span th:text="${erro}"></span>
        </div>

        <div class="auth-divider"></div>

        <!-- FORM -->
        <form th:action="@{/cadastro}"
              th:object="${tecnico}"
              method="post"
              id="form-cadastro"
              novalidate>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

          <!-- Nome -->
          <div class="form-group">
            <label for="nome" class="form-label">
              Nome completo <span class="req">*</span>
            </label>
            <input
              type="text"
              id="nome"
              th:field="*{nome}"
              th:class="${#fields.hasErrors('nome')} ? 'form-control is-invalid' : 'form-control'"
              placeholder="Ex: João Silva"
              autocomplete="name"
              autofocus>
            <div th:if="${#fields.hasErrors('nome')}" class="form-error">
              <span th:errors="*{nome}"></span>
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email" class="form-label">
              E-mail institucional <span class="req">*</span>
            </label>
            <input
              type="email"
              id="email"
              th:field="*{email}"
              th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
              placeholder="nome@senai.br"
              autocomplete="email">
            <div th:if="${#fields.hasErrors('email')}" class="form-error">
              <span th:errors="*{email}"></span>
            </div>
          </div>

          <!-- Senha -->
          <div class="form-group">
            <label for="Senha" class="form-label">
              Senha <span class="req">*</span>
            </label>
            <div class="input-group">
              <input
                type="password"
                id="Senha"
                th:field="*{Senha}"
                th:class="${#fields.hasErrors('Senha')} ? 'form-control is-invalid' : 'form-control'"
                placeholder="Mínimo de 6 caracteres"
                autocomplete="new-password">
              <button type="button"
                      class="input-group-btn"
                      id="btn-toggle-senha"
                      aria-label="Mostrar/ocultar senha"
                      onclick="toggleSenha()">👁️</button>
            </div>
            <div th:if="${#fields.hasErrors('Senha')}" class="form-error">
              <span th:errors="*{Senha}"></span>
            </div>
            <p class="form-hint">Use pelo menos 6 caracteres com letras e números.</p>
          </div>

          <div class="alert alert-info" style="margin-top:4px;">
            <span class="alert-icon">ℹ️</span>
            <span>Após o cadastro, você poderá acessar o painel de atendimento técnico.</span>
          </div>

          <button type="submit" id="btn-cadastrar" class="btn btn-primary btn-full btn-lg mt-md">
            🧑‍🔧 Criar Conta
          </button>
        </form>

        <div class="auth-footer">
          Já tem uma conta?
          <a th:href="@{/login}" id="link-login">Fazer login</a>
        </div>

        <div class="auth-footer mt-sm">
          <a th:href="@{/}" style="color:var(--text-muted);font-size:0.8rem;">
            ← Voltar para o site
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    function toggleSenha() {
      const input = document.getElementById('Senha');
      const btn   = document.getElementById('btn-toggle-senha');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
  </script>

</body>
</html>
