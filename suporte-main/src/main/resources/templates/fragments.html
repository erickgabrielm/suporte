<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ═══════════════════════════════════════════
     FRAGMENTO: head(pageTitle, pageDesc)
     ═══════════════════════════════════════════ -->
<head th:fragment="head(pageTitle, pageDesc)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" th:content="${pageDesc}">
  <title th:text="${pageTitle} + ' | Suporte SENAI'">Suporte SENAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<!-- ═══════════════════════════════════════════
     FRAGMENTO: navbar
     ═══════════════════════════════════════════ -->
<nav class="navbar" th:fragment="navbar" role="navigation" aria-label="Navegação principal">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}" aria-label="Ir para página inicial">
      <div class="brand-icon" aria-hidden="true">🛠️</div>
      <div class="brand-text">
        <span class="brand-name">SENAI Suporte</span>
        <span class="brand-sub">Sistema de Chamados</span>
      </div>
    </a>

    <div class="navbar-nav">
      <a th:href="@{/solicitacao}" class="nav-link">📋 Abrir Chamado</a>

      <!-- Autenticado -->
      <div sec:authorize="isAuthenticated()" class="d-flex align-center gap-sm">
        <a th:href="@{/painel}" class="nav-link">⚙️ Painel</a>
        <div class="nav-user">
          <span class="nav-user-name">
            👤 <span sec:authentication="name">Técnico</span>
          </span>
          <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout" id="btn-logout">↩ Sair</button>
          </form>
        </div>
      </div>

      <!-- Não autenticado -->
      <div sec:authorize="!isAuthenticated()" class="d-flex gap-sm">
        <a th:href="@{/login}" class="nav-link">🔐 Login</a>
      </div>
    </div>
  </div>
</nav>

<!-- ═══════════════════════════════════════════
     FRAGMENTO: footer
     ═══════════════════════════════════════════ -->
<footer class="site-footer" th:fragment="footer">
  <div class="container">
    <p>© 2024 <strong>SENAI</strong> — Sistema de Suporte Técnico. Todos os direitos reservados.</p>
  </div>
</footer>

<!-- ═══════════════════════════════════════════
     FRAGMENTO: alerts(Sucesso, erro, sucesso)
     ═══════════════════════════════════════════ -->
<div th:fragment="flash-messages">
  <div th:if="${Sucesso}" class="alert alert-success" role="alert">
    <span class="alert-icon">✅</span>
    <span th:text="${Sucesso}"></span>
  </div>
  <div th:if="${sucesso}" class="alert alert-success" role="alert">
    <span class="alert-icon">✅</span>
    <span th:text="${sucesso}"></span>
  </div>
  <div th:if="${erro}" class="alert alert-error" role="alert">
    <span class="alert-icon">⚠️</span>
    <span th:text="${erro}"></span>
  </div>
</div>

</html>
